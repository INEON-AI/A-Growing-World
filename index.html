<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INEON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030b12; --panel:#071a26; --line:#12485f; --cyan:#4fd8ff; --cyan-dim:#2a8fb0;
  --gold:#ffb347; --text:#d6f4ff; --muted:#7fb2c6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 18%,#0b2a3b 0%,var(--bg) 62%);
  color:var(--text); font:500 18px/1.4 "Rajdhani","Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
main{width:100%; max-width:720px; height:100%; display:flex; flex-direction:column; padding:12px 16px 16px}
.core{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px}
svg{width:min(46vw,210px); height:auto; overflow:visible}
.ring{transform-origin:100px 100px; fill:none; stroke:var(--cyan); stroke-linecap:round}
.r1{stroke-width:2; stroke-dasharray:60 14 6 14; animation:spin 22s linear infinite}
.r2{stroke-width:3; stroke-dasharray:120 40; stroke:var(--cyan-dim); animation:spin 14s linear infinite reverse}
.r3{stroke-width:1.5; stroke-dasharray:3 9; animation:spin 40s linear infinite}
.hub{fill:var(--cyan); filter:drop-shadow(0 0 10px var(--cyan)); transform-origin:100px 100px; transition:fill .3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{50%{transform:scale(1.18)}}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(1.08)}}
body[data-state="listening"] .hub{animation:beat 1.1s ease-in-out infinite}
body[data-state="thinking"] .hub{fill:var(--gold); filter:drop-shadow(0 0 12px var(--gold)); animation:beat .5s ease-in-out infinite}
body[data-state="thinking"] .r1,body[data-state="thinking"] .r2{animation-duration:3s}
body[data-state="speaking"] .hub{animation:talk .45s ease-in-out infinite}
.status{color:var(--muted); font-size:16px; min-height:1.4em; margin-top:6px}
#log{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:10px 2px; scroll-behavior:smooth}
.msg{max-width:88%; padding:9px 13px; border:1px solid var(--line); background:var(--panel); border-radius:3px 14px 14px 14px; white-space:pre-wrap; overflow-wrap:anywhere}
.msg.you{align-self:flex-end; border-color:var(--cyan-dim); background:#0a2a3a; border-radius:14px 3px 14px 14px}
.bar{display:flex; gap:8px; align-items:center; padding-top:8px}
input{flex:1; min-width:0; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:11px 16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
button{font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:999px; min-width:44px; height:44px; padding:0 14px; cursor:pointer}
button:hover{border-color:var(--cyan)}
button[aria-pressed="true"]{background:var(--cyan); color:#02131b; border-color:var(--cyan)}
#send{background:var(--cyan); color:#02131b; border-color:var(--cyan); font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-state="idle">
<main>
  <div class="core">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring r3" cx="100" cy="100" r="96"/>
      <circle class="ring r2" cx="100" cy="100" r="80"/>
      <circle class="ring r1" cx="100" cy="100" r="62"/>
      <circle class="hub" cx="100" cy="100" r="22"/>
    </svg>
    <div class="status" id="status" role="status">Online. Ready when you are.</div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div class="bar">
    <button id="wake" aria-pressed="false" aria-label="Wake word: say Yo INEON">Wake</button>
    <button id="mic" aria-pressed="false" aria-label="Speak to INEON">Mic</button>
    <input id="text" type="text" placeholder="Ask INEON anything" autocomplete="off" aria-label="Message">
    <button id="voice" aria-pressed="true" aria-label="Spoken replies">Voice</button>
    <button id="send">Send</button>
  </div>
</main>
<script>
// ---- Settings -------------------------------------------------------------
// Paste your proxy URL (see worker.js) to turn on the full AI.
// Leave it empty and INEON runs in basic mode with a few built-in commands.
const API_URL = "";
const NAME = "INEON";
const USER_TITLE = "sir"; // how INEON addresses you
// ---------------------------------------------------------------------------

const $ = id => document.getElementById(id);
const log = $("log"), input = $("text"), micBtn = $("mic"), voiceBtn = $("voice");
const history = [];
let speakOn = true, listening = false, busy = false, rec = null;
let wakeOn = false, speaking = false, awaiting = false, nextOnce = false, mode = "once";
const WAKE = /\byo[\s,.!-]*(?:i[\s-]?neon|ineon|ee[\s-]?neon|ya[\s-]?neon|neon)\b[\s,.!:-]*/i;

function setState(s, label){
  document.body.dataset.state = s;
  $("status").textContent = label || ({idle:(wakeOn ? "Waiting for “Yo INEON”." : "Ready."), listening:"Listening…", thinking:"Working on it…", speaking:"Speaking…"}[s]);
}
function add(role, text){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "you" : "ai");
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function say(text){
  if(!speakOn || !("speechSynthesis" in window)) return setState("idle");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g,""));
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find(v => /en-GB/i.test(v.lang) && /male|daniel|google uk english male/i.test(v.name)) || voices.find(v => /en-GB/i.test(v.lang)) || null;
  u.rate = 1.02; u.pitch = 0.9;
  u.onstart = () => { speaking = true; setState("speaking"); if(wakeOn && rec) try{ rec.stop(); }catch(e){} };
  u.onend = u.onerror = () => { speaking = false; setState("idle"); if(wakeOn) setTimeout(() => startRec("wake"), 350); };
  speechSynthesis.speak(u);
}

function basic(q){
  const s = q.toLowerCase(), now = new Date();
  if(/\b(hello|hi|hey|good (morning|evening|afternoon))\b/.test(s)) return `At your service, ${USER_TITLE}.`;
  if(/\btime\b/.test(s)) return `It is ${now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}.`;
  if(/\b(date|day|today)\b/.test(s)) return `Today is ${now.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric", year:"numeric"})}.`;
  const g = s.match(/^(?:search|google|look up)\s+(.+)/);
  if(g){ window.open("https://www.google.com/search?q=" + encodeURIComponent(g[1]), "_blank", "noopener"); return `Searching for ${g[1]}.`; }
  if(/\bgithub\b/.test(s) && /\b(open|go)\b/.test(s)){ window.open("https://github.com", "_blank", "noopener"); return "Opening GitHub."; }
  return `I can only handle simple commands in basic mode, ${USER_TITLE}. Add your proxy URL in index.html to unlock full conversation.`;
}

async function ask(q){
  if(!API_URL) return basic(q);
  const res = await fetch(API_URL, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({messages: history.slice(-20)})
  });
  if(!res.ok) throw new Error("Proxy returned " + res.status);
  const data = await res.json();
  return data.reply || "I have nothing to report.";
}

async function submit(q){
  q = q.trim(); if(!q || busy) return;
  busy = true; input.value = ""; add("user", q);
  history.push({role:"user", content:q});
  setState("thinking");
  try{
    const reply = await ask(q);
    history.push({role:"assistant", content:reply});
    add("ai", reply); say(reply);
    if(!speakOn || !("speechSynthesis" in window)) setState("idle");
  }catch(e){
    const m = `I couldn’t reach my servers, ${USER_TITLE}. Check that API_URL points to your proxy and that it allows this site.`;
    history.pop(); add("ai", m); setState("idle", "Connection failed.");
  }
  busy = false;
}

// Voice input and wake word
const wakeBtn = $("wake");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startRec(m){ if(!rec || listening) return; mode = m; rec.continuous = (m === "wake"); try{ rec.start(); }catch(e){} }
function heard(t){
  t = t.trim(); if(!t) return;
  if(mode === "once"){ submit(t); return; }
  if(awaiting){ awaiting = false; submit(t); return; }
  const m = t.match(WAKE); if(!m) return;
  const cmd = t.slice(m.index + m[0].length).trim();
  if(cmd){ submit(cmd); return; }
  awaiting = true; const hi = `Yes, ${USER_TITLE}?`; add("ai", hi); say(hi); setState("listening", "Go ahead…");
}
if(!SR){ micBtn.hidden = true; wakeBtn.hidden = true; }
else{
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onstart = () => { listening = true; micBtn.setAttribute("aria-pressed", mode === "once"); };
  rec.onresult = e => { for(let i = e.resultIndex; i < e.results.length; i++) if(e.results[i].isFinal) heard(e.results[i][0].transcript); };
  rec.onerror = ev => { if(ev.error === "not-allowed"){ wakeOn = false; wakeBtn.setAttribute("aria-pressed","false"); setState("idle","Microphone blocked. Allow it in your browser."); } };
  rec.onend = () => {
    listening = false; micBtn.setAttribute("aria-pressed","false");
    if(nextOnce){ nextOnce = false; startRec("once"); return; }
    if(wakeOn && !speaking){ setTimeout(() => startRec("wake"), 300); return; }
    if(!busy && !speaking) setState("idle");
  };
  micBtn.onclick = () => {
    speechSynthesis && speechSynthesis.cancel();
    if(listening && mode === "once"){ rec.stop(); return; }
    if(listening){ nextOnce = true; rec.stop(); setState("listening"); return; }
    setState("listening"); startRec("once");
  };
  wakeBtn.onclick = () => {
    wakeOn = !wakeOn; awaiting = false; wakeBtn.setAttribute("aria-pressed", wakeOn);
    if(wakeOn){ setState("idle"); startRec("wake"); } else { try{ rec.stop(); }catch(e){} setState("idle"); }
  };
}
voiceBtn.onclick = () => {
  speakOn = !speakOn; voiceBtn.setAttribute("aria-pressed", speakOn);
  if(!speakOn){ speechSynthesis.cancel(); setState("idle"); }
};
$("send").onclick = () => submit(input.value);
input.addEventListener("keydown", e => { if(e.key === "Enter") submit(input.value); });

add("ai", `INEON online, ${USER_TITLE}. Tap Wake, then say “Yo INEON” any time.`);
</script>
</body>
</html>
